name: Derle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: pip install -r requirements.txt pyinstaller

      - name: Exe derle
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: MasaustuDostlari
          path: dist/MasaustuDostlari.exe

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MasaustuDostlari.exe
          generate_release_notes: true
